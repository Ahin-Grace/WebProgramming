<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>


    <h2> Form Task </h2>

    <label>Text: </label><br>
    <input type="text">
    <br><br>

    <label>Password: </label><br>
    <input type="password">
    <br><br>

    <label>Email: </label><br>
    <input type="email">
    <br><br>

    <label>Number: </label><br>
    <input type="text">
    <br><br>

    <label>Telephone: </label><br>
    <input type="tel" id="tel" name="tel" placeholder="01XXXXXXXXX">
    <br><br>

    <label for="date">Date: </label><br>
    <input type="date">
    <br><br>

    <label>Checkbox:</label> <br>

    <input type="checkbox">
    <label for="">Option 1</label>

    <input type="checkbox">
    <label for="">Option 2</label>
    <br><br>

    <label for="">Radio</label><br>

    <input type="radio">
    <label for="">Male</label>

    <input type="radio">
    <label for="">Female</label>
    <br><br>

    <label for="">File Upload:</label><br>
    <input type="file">
    <br><br>

    <label for="">Dropdown (Select): </label><br>
    <select name="" id="">
        <option value="">Option 1</option>
        <option value="">Option 2</option>
    </select>
    <br><br>

    <label for="">Textarea: </label><br>
    <Textarea rows="5" cols="35"></Textarea>

    <br><br>
    <button type="submit">Submit</button>
    <button type="reset">Reset</button>


</body>

</html>
